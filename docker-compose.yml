services:
  # Mode Development: Hot Module Replacement (HMR) aktif, kode sinkron langsung
  dev:
    build:
      context: .
      target: dev
    container_name: jersey-builder-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  # Mode Production: Ringan dan cepat dengan Nginx Alpine
  prod:
    build:
      context: .
      target: prod
    container_name: jersey-builder-prod
    ports:
      - "8080:80"
    restart: unless-stopped
